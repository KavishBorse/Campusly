services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27019}:27017"
    volumes:
      - campusly_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4001
      FRONTEND_ORIGIN: http://localhost:${WEB_HOST_PORT:-5173}
      MONGODB_URI: mongodb://mongo:27017/campusly
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_STUDENT_ENROLLMENT: ${SEED_STUDENT_ENROLLMENT:-}
      SEED_STUDENT_NAME: ${SEED_STUDENT_NAME:-}
      SEED_STUDENT_PHONE: ${SEED_STUDENT_PHONE:-}
      SEED_CLUB_USERNAME: ${SEED_CLUB_USERNAME:-}
      SEED_CLUB_PASSWORD: ${SEED_CLUB_PASSWORD:-}
      SEED_CLUB_NAME: ${SEED_CLUB_NAME:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4001}:4001"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  campusly_mongo_data:
